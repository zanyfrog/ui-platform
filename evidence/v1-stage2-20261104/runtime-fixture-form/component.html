<section class="uip-layout-item" data-uip-node="content"><h2 data-uip-node="heading">Inventory form</h2><p data-uip-node="instructions">Complete the fields and submit to save.</p><uib-forms-form data-uip-node="form" label="Inventory form">
<div class="uip-layout-item" data-uip-node="row_name"><uib-forms-textbox data-uip-node="control_name" name="name" label="name"></uib-forms-textbox><span data-uip-field-error="field_inventory-name" role="alert"></span></div>
<div class="uip-layout-item" data-uip-node="row_quantity"><uib-forms-number data-uip-node="control_quantity" name="quantity" label="quantity"></uib-forms-number><span data-uip-field-error="field_inventory-quantity" role="alert"></span></div>
<div class="uip-layout-item" data-uip-node="row_active"><uib-forms-checkbox data-uip-node="control_active" name="active" label="active"></uib-forms-checkbox><span data-uip-field-error="field_inventory-active" role="alert"></span></div>
<div class="uip-layout-item" data-uip-node="row_notes"><uib-forms-textbox data-uip-node="control_notes" name="notes" label="notes"></uib-forms-textbox><span data-uip-field-error="field_inventory-notes" role="alert"></span></div>
<div class="uip-layout-item" data-uip-node="row_secret"><uib-forms-textbox data-uip-node="control_secret" name="secret" label="secret"></uib-forms-textbox><span data-uip-field-error="field_inventory-secret" role="alert"></span></div>
</uib-forms-form><p data-uip-node="submit-error" role="alert"></p><pre data-uip-node="saved-result"></pre></section>
