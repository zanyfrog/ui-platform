<div class="uip-layout-item shell" data-uip-node="public_shell">
  <header data-uip-node="public_header"><img data-uip-node="public_logo" data-uip-branding="primaryLogo" alt="Application logo"><strong data-uip-node="public_name" data-uip-branding="applicationName"></strong><nav data-uip-node="public_nav" data-uip-menu="main" aria-label="Main navigation"></nav></header>
  <section data-uip-node="public_hero" data-uip-region="region-hero" data-uip-region-name="Hero"><uib-hero data-uip-node="public_default_hero" hero-data="{&quot;heading&quot;:&quot;Welcome&quot;,&quot;description&quot;:&quot;Make this Application your own.&quot;}"></uib-hero></section>
  <main data-uip-node="public_region_main" data-uip-region="region-main" data-uip-region-name="Main Content"></main>
  <footer data-uip-node="public_footer">Built with UI Platform</footer>
</div>
